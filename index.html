<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حمید گل‌محمدی | رزومه مدیریتی (Executive Portfolio)</title>
    <!-- فونت وزیرمتن برای نمایش استاندارد فارسی و اعداد -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- کتابخانه استاندارد تولید QR Code در مرورگر -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --bg-elevated: #F1F5F9;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --navy-deep: #0B1528;
            --navy-accent: #1E293B;
            --gold-primary: #C5A059;
            --gold-light: #FBF7F0;
            --gold-border: #E6D3A7;
            --teal-accent: #0D9488;
            --border-color: #E2E8F0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.12);
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        [data-theme="dark"] {
            --bg-primary: #090F1C;
            --bg-secondary: #111C30;
            --bg-elevated: #1A2942;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --navy-deep: #050911;
            --navy-accent: #1E293B;
            --gold-primary: #D4AF37;
            --gold-light: rgba(212, 175, 55, 0.12);
            --gold-border: rgba(212, 175, 55, 0.35);
            --teal-accent: #14B8A6;
            --border-color: #1E293B;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.75;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .ltr-inline {
            direction: ltr;
            display: inline-block;
            font-family: 'Vazirmatn', sans-serif;
            unicode-bidi: embed;
        }

        /* کانتینر صفحات چاپی که فقط در زمان پرینت فعال می‌شود */
        #printPagesContainer {
            display: none;
        }

        /* نوار ناوبری هوشمند */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 21, 40, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            padding: 0.75rem 1.5rem;
            color: #FFFFFF;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.1rem;
            color: #FFFFFF;
            text-decoration: none;
            user-select: none;
        }

        .nav-brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--gold-primary), #9A7B38);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B1528;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 1.15rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #CBD5E1;
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 500;
            padding: 0.35rem 0.55rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold-primary);
            background: rgba(197, 160, 89, 0.12);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-wrap: wrap;
        }

        .btn-icon, .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-action.gold {
            background: linear-gradient(135deg, var(--gold-primary), #A6833E);
            color: #0B1528;
            border-color: transparent;
            font-weight: 700;
        }

        .btn-action.outline-gold {
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid rgba(197, 160, 89, 0.5);
            color: #E6C687;
            font-weight: 600;
        }

        .btn-icon:hover, .btn-action:hover {
            transform: translateY(-1px);
            border-color: var(--gold-primary);
        }

        /* ==========================================================================
           استایل کارت ویزیت دیجیتال رسمی و لوکس بانکی (Executive Business Card)
           ========================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(6, 11, 22, 0.82);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .bcard-modal-wrapper {
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* خودِ کارت ویزیت با نسبت استاندارد طلایی */
        .executive-bcard {
            width: 100%;
            background: radial-gradient(circle at 15% 15%, #1E293B 0%, #0B1528 60%, #050912 100%);
            border: 1.5px solid rgba(197, 160, 89, 0.55);
            border-radius: 20px;
            padding: 2rem 2.1rem 1.75rem;
            color: #FFFFFF;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(197, 160, 89, 0.15) inset;
            position: relative;
            overflow: hidden;
        }

        /* نوار طلایی بالای کارت ویزیت */
        .executive-bcard::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 5px;
            background: linear-gradient(90deg, #8A6B2F 0%, #E6C687 50%, #C5A059 100%);
        }

        /* طرح هندسی محو در پس‌زمینه کارت */
        .executive-bcard::after {
            content: '';
            position: absolute;
            left: -60px;
            bottom: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 28px solid rgba(197, 160, 89, 0.04);
            pointer-events: none;
        }

        .bcard-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.25rem;
            margin-bottom: 1.35rem;
        }

        .bcard-identity {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .bcard-monogram-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.35rem;
        }

        .bcard-monogram {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #E6C687, #9A7B38);
            color: #0B1528;
            font-weight: 900;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.3);
        }

        .bcard-badge-en {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #E6C687;
            font-weight: 700;
        }

        .bcard-name {
            font-size: 1.75rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.3px;
            line-height: 1.25;
        }

        .bcard-headline {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--gold-primary);
            margin-top: 0.1rem;
        }

        .bcard-roles-box {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .bcard-role-line {
            font-size: 0.83rem;
            color: #E2E8F0;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .bcard-role-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold-primary);
            flex-shrink: 0;
        }

        .bcard-qr-frame {
            background: #FFFFFF;
            padding: 0.65rem;
            border-radius: 14px;
            border: 2px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
        }

        .bcard-qr-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #0B1528;
            letter-spacing: -0.2px;
        }

        .bcard-divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(197, 160, 89, 0.05) 0%, rgba(197, 160, 89, 0.45) 50%, rgba(197, 160, 89, 0.05) 100%);
            margin: 0.9rem 0;
        }

        .bcard-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.65rem 1.25rem;
            font-size: 0.82rem;
        }

        @media (max-width: 520px) {
            .bcard-top-row {
                flex-direction: column-reverse;
                align-items: center;
                text-align: center;
            }
            .bcard-monogram-row, .bcard-role-line {
                justify-content: center;
            }
            .bcard-contact-grid {
                grid-template-columns: 1fr;
            }
        }

        .bcard-contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.45rem 0.75rem;
            border-radius: 8px;
            color: #E2E8F0;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .bcard-contact-item:hover {
            border-color: var(--gold-primary);
            background: rgba(197, 160, 89, 0.08);
        }

        .bcard-contact-label {
            color: #94A3B8;
            font-size: 0.75rem;
        }

        .bcard-contact-val {
            font-weight: 700;
            color: #FFFFFF;
            font-size: 0.8rem;
        }

        .bcard-actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            justify-content: center;
            width: 100%;
        }

        /* پنجره مودال مخفی تنظیمات ادمین (فقط با Ctrl+Shift+Q یا ۳ بار کلیک روی لوگو) */
        .admin-modal {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--gold-primary);
            border-radius: var(--radius-lg);
            max-width: 460px;
            width: 100%;
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .qr-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            text-align: right;
            margin: 1rem 0 1.2rem;
        }

        .qr-input-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .qr-url-input {
            width: 100%;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
        }

        /* بخش اول: Executive Hero */
        .hero {
            background: radial-gradient(circle at 85% 20%, #1E293B 0%, #0B1528 65%, #060B16 100%);
            color: #FFFFFF;
            padding: 4.5rem 1.5rem 4rem;
            border-bottom: 3px solid var(--gold-primary);
            position: relative;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.25rem;
        }

        @media (min-width: 992px) {
            .hero-container {
                grid-template-columns: 1.5fr 1.2fr;
                align-items: center;
            }
        }

        .executive-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(197, 160, 89, 0.15);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #E6C687;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        .hero-name {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            color: #FFFFFF;
        }

        .hero-title {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: var(--gold-primary);
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .hero-subtitle {
            color: #CBD5E1;
            font-size: 1rem;
            max-width: 780px;
            margin-bottom: 1.75rem;
            text-align: justify;
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #E2E8F0;
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: var(--radius-lg);
            padding: 1.65rem 1.8rem;
            backdrop-filter: blur(8px);
            width: 100%;
        }

        .hero-card-title {
            font-size: 0.95rem;
            color: var(--gold-primary);
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-card-top-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .hero-stat-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            flex: 1;
        }

        .hero-stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .hero-stat-label {
            font-size: 0.82rem;
            color: #94A3B8;
        }

        .hero-stat-value {
            font-size: 0.98rem;
            font-weight: 700;
            color: #FFFFFF;
        }

        /* باکس QR Code داخل بخش Hero */
        .hero-qr-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            background: #FFFFFF;
            padding: 0.55rem;
            border-radius: 10px;
            border: 2px solid var(--gold-primary);
            cursor: pointer;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .hero-qr-widget:hover {
            transform: scale(1.03);
        }

        .hero-qr-caption {
            font-size: 0.65rem;
            font-weight: 800;
            color: #0B1528;
            text-align: center;
            line-height: 1.2;
        }

        .hero-contact-bar {
            margin-top: 1.15rem;
            padding-top: 0.95rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            font-size: 0.86rem;
        }

        .hero-contact-bar a,
        .hero-contact-row {
            color: #E2E8F0;
            text-decoration: none;
            display: flex;
